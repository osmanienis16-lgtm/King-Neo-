
<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Neo AI" />
  <title>Neo AI — King Neo Studio</title>
  <style>
    :root {
      --bg: #03060c;
      --card: #0b111e;
      --border: #172744;
      --blue: #0095ff;
      --cyan: #38bdf8;
      --red: #dc2626;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    body {
      background: radial-gradient(circle at top, #07234d 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    }
    .app { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .logo {
      font-size: 1.35rem; font-weight: 900;
      background: linear-gradient(90deg, #fff, #38bdf8, #0088ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sublogo { font-size: 0.65rem; color: var(--cyan); letter-spacing: 1.3px; font-weight: 700; }
    .badge {
      font-size: 0.7rem; font-weight: 700; padding: 5px 10px; border-radius: 999px;
      background: rgba(34, 197, 94, 0.16); border: 1px solid rgba(74, 222, 128, 0.45); color: #bbf7d0;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .label { font-size: 0.78rem; color: #93c5fd; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .upload-box {
      border: 2px dashed #1e40af; border-radius: 14px; min-height: 165px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; text-align: center; padding: 12px; background: rgba(0, 110, 255, 0.05);
    }
    .upload-box img { max-height: 190px; max-width: 100%; border-radius: 12px; object-fit: cover; }
    input[type="text"], input[type="file"] {
      width: 100%; background: #060911; border: 1px solid var(--border);
      color: var(--text); border-radius: 12px; padding: 11px; font-size: 0.9rem;
    }
    .chips { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .chip {
      background: #0f1c33; border: 1px solid #1e3a6d; color: #e0f2fe;
      font-size: 0.74rem; font-weight: 700; padding: 9px 4px; border-radius: 12px; text-align: center;
    }
    .chip.active {
      background: linear-gradient(135deg, #0055ff, #00b7ff); border-color: #38bdf8; color: white;
    }
    .btn-main {
      width: 100%; border: none; padding: 14px; border-radius: 14px;
      font-size: 0.96rem; font-weight: 800; color: white;
      background: linear-gradient(135deg, #0055ff, #00b7ff);
      box-shadow: 0 6px 20px rgba(0, 136, 255, 0.35);
    }
    .btn-rec {
      width: 100%; border: none; padding: 14px; border-radius: 14px;
      font-size: 0.96rem; font-weight: 800; color: white;
      background: linear-gradient(135deg, #dc2626, #ef4444);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.35);
    }
    .btn-main:disabled, .btn-rec:disabled { opacity: 0.5; }
    .status { text-align: center; font-size: 0.82rem; color: #7dd3fc; min-height: 18px; }
    canvas, video { width: 100%; border-radius: 14px; background: black; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="logo">👑 NEO AI</div>
        <div class="sublogo">KING NEO • 100% FALAS</div>
      </div>
      <div class="badge">Falas 100% ✅</div>
    </header>

    <div class="card">
      <div class="label">1. Zgjidh Foton (King Neo)</div>
      <div class="upload-box" id="imageBox">
        <span style="font-size: 2rem;">👑</span>
        <span style="font-weight: 700;">Prek për të zgjedhur Foton</span>
        <span style="font-size: 0.76rem; color: var(--muted);">Nga galeria e iPhone</span>
      </div>
      <input type="file" id="imageInput" accept="image/*" class="hidden" />
    </div>

    <div class="card">
      <div class="label">2. Ngarko Këngën / Beat-in (Opsionale)</div>
      <input type="file" id="audioInput" accept="audio/*" />
      <div class="label" style="margin-top: 4px;">3. Efekti i Videos</div>
      <div class="chips">
        <button class="chip active" data-style="drill">🔥 Blue Drill</button>
        <button class="chip" data-style="king">👑 Mbreti</button>
        <button class="chip" data-style="eagle">🦅 Kuq e Zi</button>
      </div>
      <input type="text" id="overlayText" placeholder="Teksti mbi video (p.sh. KING NEO)" value="KING NEO" />
    </div>

    <div class="status" id="statusText">Ngarko foton dhe prek Luaj ose Regjistro!</div>

    <button class="btn-main" id="playBtn">▶️ Luaj Animacionin</button>
    <button class="btn-rec" id="recordBtn">🔴 Regjistro Video (10 sek) & Ruaj</button>

    <div class="card hidden" id="previewCard">
      <div class="label">Parashikimi Live 🔥</div>
      <canvas id="stage" width="540" height="720"></canvas>
      <audio id="bgAudio" playsinline class="hidden"></audio>
    </div>

    <div class="card hidden" id="exportCard">
      <div class="label">Videoja jote gati për TikTok 🎉</div>
      <video id="recordedVideo" controls playsinline loop></video>
      <a id="downloadLink" download="neo-ai-drill.mp4" style="text-decoration:none;">
        <button class="btn-main" type="button">⬇️ Shkarko Videon në iPhone</button>
      </a>
    </div>
  </div>

  <script>
    const imageBox = document.getElementById("imageBox");
    const imageInput = document.getElementById("imageInput");
    const audioInput = document.getElementById("audioInput");
    const overlayText = document.getElementById("overlayText");
    const statusText = document.getElementById("statusText");
    const playBtn = document.getElementById("playBtn");
    const recordBtn = document.getElementById("recordBtn");
    const previewCard = document.getElementById("previewCard");
    const exportCard = document.getElementById("exportCard");
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const bgAudio = document.getElementById("bgAudio");
    const recordedVideo = document.getElementById("recordedVideo");
    const downloadLink = document.getElementById("downloadLink");

    let img = null;
    let currentStyle = "drill";
    let animId = null;
    let audioCtx = null;
    let analyser = null;
    let freqData = null;
    let audioDest = null;
    let sourceCreated = false;

    const sparks = Array.from({ length: 38 }, () => ({
      x: Math.random() * 540,
      y: Math.random() * 720,
      r: 1.5 + Math.random() * 3.5,
      s: 1.2 + Math.random() * 2.8,
      a: 0.3 + Math.random() * 0.7
    }));

    document.querySelectorAll(".chip").forEach((c) => {
      c.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach((x) => x.classList.remove("active"));
        c.classList.add("active");
        currentStyle = c.dataset.style;
      });
    });

    imageBox.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      imageBox.innerHTML = `<img src="${url}" />`;
      img = new Image();
      img.src = url;
    });

    audioInput.addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      bgAudio.src = URL.createObjectURL(f);
    });

    function setupAudio() {
      if (!bgAudio.src) return;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        audioDest = audioCtx.createMediaStreamDestination();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!sourceCreated) {
        const src = audioCtx.createMediaElementSource(bgAudio);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.connect(audioDest);
        sourceCreated = true;
      }
      bgAudio.currentTime = 0;
      bgAudio.play().catch(() => {});
    }

    function getBassLevel(t) {
      if (analyser && !bgAudio.paused) {
        analyser.getByteFrequencyData(freqData);
        return (freqData[0] + freqData[1] + freqData[2]) / (3 * 255);
      }
      return Math.pow(Math.abs(Math.sin(t * Math.PI * 2.33)), 6) * 0.75;
    }

    function startAnimation() {
      if (!img) {
        alert("Ngarko foton fillimisht!");
        return false;
      }
      cancelAnimationFrame(animId);
      previewCard.classList.remove("hidden");
      setupAudio();

      let t0 = null;
      function frame(ts) {
        if (!t0) t0 = ts;
        const t = (ts - t0) / 1000;
        const w = canvas.width, h = canvas.height;
        const bass = getBassLevel(t);

        ctx.clearRect(0, 0, w, h);

        let scale = 1.07 + bass * 0.065 + Math.sin(t * 1.3) * 0.02;
        let dx = Math.sin(t * 2.2) * (6 + bass * 10);
        let dy = Math.cos(t * 2.7) * 6 - bass * 6;
        let angle = Math.sin(t * 1.1) * 0.014;

        if (currentStyle === "king") {
          scale = 1.04 + Math.sin(t * 0.8) * 0.05 + bass * 0.03;
          dx = Math.sin(t * 0.8) * 8;
          angle = Math.sin(t * 0.6) * 0.008;
        }

        ctx.save();
        ctx.translate(w / 2 + dx, h / 2 + dy);
        ctx.rotate(angle);
        ctx.scale(scale, scale);

        const ir = img.width / img.height;
        const cr = w / h;
        const dw = ir > cr ? h * ir : w;
        const dh = ir > cr ? h : w / ir;
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        ctx.restore();

        const glowColor = currentStyle === "eagle"
          ? `rgba(220, 38, 38, ${0.25 + bass * 0.45})`
          : `rgba(0, 149, 255, ${0.22 + bass * 0.48})`;

        const grad = ctx.createRadialGradient(w / 2, h / 2, w * 0.25, w / 2, h / 2, w * 0.85);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(1, glowColor);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        sparks.forEach((p) => {
          p.y -= p.s * (1 + bass * 2.2);
          p.x += Math.sin(t * 2 + p.y * 0.02) * 0.8;
          if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (1 + bass * 0.5), 0, Math.PI * 2);
          ctx.fillStyle = currentStyle === "eagle"
            ? `rgba(248, 113, 113, ${p.a})`
            : `rgba(56, 189, 248, ${p.a})`;
          ctx.fill();
        });

        const label = overlayText.value.trim();
        if (label) {
          ctx.save();
          ctx.font = "900 34px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.shadowColor = currentStyle === "eagle" ? "#dc2626" : "#0095ff";
          ctx.shadowBlur = 16 + bass * 18;
          ctx.fillStyle = "#ffffff";
          ctx.fillText(label.toUpperCase(), w / 2, h - 42);
          ctx.restore();
        }

        animId = requestAnimationFrame(frame);
      }

      animId = requestAnimationFrame(frame);
      return true;
    }

    playBtn.addEventListener("click", () => {
      if (startAnimation()) {
        statusText.textContent = "▶️ Animacioni po luan live!";
      }
    });

    recordBtn.addEventListener("click", () => {
      if (!startAnimation()) return;

      try {
        const videoStream = canvas.captureStream(30);
        const tracks = [...videoStream.getVideoTracks()];
        if (audioDest && bgAudio.src) {
          tracks.push(...audioDest.stream.getAudioTracks());
        }
        const combinedStream = new MediaStream(tracks);

        const mime = MediaRecorder.isTypeSupported("video/mp4")
          ? "video/mp4"
          : MediaRecorder.isTypeSupported("video/webm")
          ? "video/webm"
          : "";

        const recorder = mime
          ? new MediaRecorder(combinedStream, { mimeType: mime, videoBitsPerSecond: 2500000 })
          : new MediaRecorder(combinedStream);

        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const finalType = mime || "video/mp4";
          const blob = new Blob(chunks, { type: finalType });
          const videoURL = URL.createObjectURL(blob);
          recordedVideo.src = videoURL;
          downloadLink.href = videoURL;
          downloadLink.download = finalType.includes("webm") ? "neo-ai.webm" : "neo-ai.mp4";
          exportCard.classList.remove("hidden");
          recordBtn.disabled = false;
          statusText.textContent = "✅ Videoja u regjistrua! Shtyp 'Shkarko Videon' poshtë.";
        };

        recordBtn.disabled = true;
        recorder.start();
        let sec = 10;
        statusText.textContent = `🔴 Duke regjistruar videon... (${sec}s)`;

        const timer = setInterval(() => {
          sec--;
          if (sec > 0) {
            statusText.textContent = `🔴 Duke regjistruar videon... (${sec}s)`;
          } else {
            clearInterval(timer);
            recorder.stop();
          }
        }, 1000);
      } catch (err) {
        recordBtn.disabled = false;
        statusText.textContent = "⚠️ Shfletuesi nuk e lejoi regjistrimin automatik, por mund të bësh Screen Record!";
      }
    });
  </script>
</body>
</html>
